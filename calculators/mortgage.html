<!DOCTYPE html>
<html lang="en">
<head>
<title>Mortgage Calculator - SmartCalc</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
<h1>Mortgage Calculator</h1>
<p>Calculate your monthly mortgage payment</p>
</header>

<div class="card">
<label>Loan Amount ($)</label>
<input id="loan" type="number" value="300000">

<label>Interest Rate (%)</label>
<input id="rate" type="number" value="6">

<label>Years</label>
<input id="years" type="number" value="30">

<button onclick="calc()">Calculate</button>

<h2 id="result"></h2>
</div>

<script>
function calc(){
let loan=document.getElementById("loan").value;
let rate=document.getElementById("rate").value/100/12;
let years=document.getElementById("years").value*12;

let payment=loan*(rate*Math.pow(1+rate,years))/(Math.pow(1+rate,years)-1);

document.getElementById("result").innerHTML=
"Monthly Payment: $" + payment.toFixed(2);
}
</script>

</body>
</html>
