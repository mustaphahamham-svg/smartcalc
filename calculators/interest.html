<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interest Calculator - SmartCalc</title>

<link rel="stylesheet" href="../style.css">
</head>


<body>

<header>
<h1>Interest Calculator</h1>
<p>Calculate simple interest and total amount</p>
</header>


<div class="card">

<label>Principal Amount ($)</label>
<input id="principal" type="number" value="1000">


<label>Interest Rate (%)</label>
<input id="rate" type="number" value="5">


<label>Time (Years)</label>
<input id="time" type="number" value="1">


<button onclick="calculateInterest()">
Calculate
</button>


<h2 id="result"></h2>

</div>



<script>

function calculateInterest(){

let principal = Number(document.getElementById("principal").value);

let rate = Number(document.getElementById("rate").value);

let time = Number(document.getElementById("time").value);


let interest = (principal * rate * time) / 100;

let total = principal + interest;


document.getElementById("result").innerHTML =
"Interest: $" + interest.toFixed(2) +
"<br>Total Amount: $" + total.toFixed(2);

}

</script>


</body>

</html>
