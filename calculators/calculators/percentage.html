<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Percentage Calculator - SmartCalc</title>

<link rel="stylesheet" href="../style.css">
</head>


<body>

<header>
<h1>Percentage Calculator</h1>
<p>Calculate percentages easily</p>
</header>


<div class="card">

<h2>Find Percentage</h2>

<label>Number</label>
<input id="number" type="number" placeholder="Enter number">


<label>Percentage (%)</label>
<input id="percentage" type="number" placeholder="Enter percentage">


<button onclick="calculatePercentage()">
Calculate
</button>


<h2 id="result"></h2>


</div>


<script>

function calculatePercentage(){

let number = document.getElementById("number").value;

let percentage = document.getElementById("percentage").value;


let result = (number * percentage) / 100;


document.getElementById("result").innerHTML =
"Result: " + result;

}

</script>


</body>

</html>
